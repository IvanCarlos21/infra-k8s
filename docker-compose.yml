version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: adpassword  # Mot de passe root MySQL
      MYSQL_DATABASE: crud_app            # Nom de la base de données
      MYSQL_USER: user
      MYSQL_PASSWORD: uspassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - crud_app

  app:
    build: .
    container_name: my_crud_app
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/var/log  
    restart: always
    networks:
      - crud_app

volumes:
  mysql_data:
networks:
  crud_app:
    driver: bridge